<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign-in — Host inbox</title>
  <link rel="stylesheet" href="/static/mail.css?v=write">
</head>
<body class="login-body">
  <div class="card">
    <div class="mark">AD</div>
    <h1>Admin directory</h1>
    <p class="muted">This page lists mailbox addresses and their private access links. Enter the admin password set on the server. Unique mailbox links do not open this page.</p>
    <form method="post" action="/admin/login" class="admin-form">
      <label class="label" for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn full" type="submit">Open directory</button>
    </form>
    {% if error %}
    <p class="error">That password is not correct.</p>
    {% endif %}
  </div>
</body>
</html>
