# Copy to /opt/mailcow-dockerized/data/conf/nginx/site.mailbox.custom
# Mailcow default IPv4 network gateway (host) is 172.22.1.1 — do not restart the stack.
location /brands/ {
  proxy_pass http://172.22.1.1:8787/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Script-Name /brands;
  proxy_set_header X-Forwarded-Prefix /brands;
  proxy_hide_header X-Powered-By;
  proxy_read_timeout 3600;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control "no-store" always;
}
