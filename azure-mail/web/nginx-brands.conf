# Copy to /opt/mailcow-dockerized/data/conf/nginx/site.mailbox.custom
# (Mailcow includes site.*.custom inside the HTTPS server).
# then: docker compose -f /opt/mailcow-dockerized/docker-compose.yml restart nginx-mailcow
location /brands/ {
  proxy_pass http://host.docker.internal:8787/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600;
}
