{% extends "base.html" %}
{% block title %}Working{% endblock %}
{% block body %}
<h1 id="heading">Working</h1>
<p class="muted" id="status">Working…</p>
<div id="success" class="card hidden">
  <h2>Verified</h2>
  <p>Azure send is linked. You do not need to add DNS again.</p>
  <p id="success-mail"></p>
  <p><a class="btn" href="https://mail.seethinajayadileep.dev/">Open webmail</a></p>
</div>
<div id="checks" class="card hidden"></div>
<div id="again" class="card hidden">
  <p id="again-why">Not finished yet.</p>
  <form method="post" action="{{ url_for('dns_verify') }}" id="again-form">
    <input type="hidden" name="domain" id="again-domain" value="">
    <input type="hidden" name="local_part" value="akruti">
    <button type="submit">Verify again</button>
    <a class="btn ghost" id="again-link" href="{{ url_for('dns_page') }}">Open DNS page</a>
  </form>
</div>
<pre class="log" id="log">{% for line in job.log %}{{ line }}
{% endfor %}</pre>
<div id="dns" class="hidden"></div>
<script>
const url = {{ url_for('job_json', job_id=job_id) | tojson }};
const dnsPage = {{ url_for('dns_page') | tojson }};
function checksHtml(st) {
  if (!st) return '';
  const labels = {Domain: 'Domain TXT', SPF: 'SPF TXT', DKIM: 'DKIM 1', DKIM2: 'DKIM 2'};
  const pending = Object.entries(st).filter(([, v]) => v !== 'Verified').map(([k]) => labels[k] || k);
  const pills = Object.entries(st).map(([k, v]) => {
    const on = v === 'Verified';
    return `<span class="pill ${on ? 'on' : 'wait'}">${labels[k] || k}: ${on ? 'Verified' : 'Pending'}</span>`;
  }).join(' ');
  return `<h2>Azure checks</h2><p>${pills}</p>
    <p class="muted">${pending.length ? 'Still pending: <strong>' + pending.join(', ') + '</strong>. Only that row must finish — do not re-add the whole table.' : 'All four passed.'}</p>`;
}
function dnsTable(records, verified) {
  if (!records || !records.length) return '';
  const rows = records.map(r => `<tr>
    <td>${r.type}</td>
    <td><code>${r.host || '@'}</code></td>
    <td>${r.priority ?? '—'}</td>
    <td class="val"><code>${r.value}</code></td>
  </tr>`).join('');
  const title = verified ? 'Already on the domain (reference)' : 'DNS to add at your domain provider';
  const hint = verified
    ? 'You do not need to add these again.'
    : 'Add every row at the registrar, then Verify again.';
  return `<div class="card dns"><h2>${title}</h2><p class="muted">${hint}</p>
    <table><thead><tr><th>Type</th><th>Host</th><th>Priority</th><th>Value</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
async function tick() {
  const r = await fetch(url);
  const j = await r.json();
  document.getElementById('log').textContent = (j.log || []).join('\n');
  const domain = j.result && j.result.domain;
  const verified = !!(j.result && j.result.verified);
  const st = (j.result && j.result.verify_status) || null;
  if (st) {
    const c = document.getElementById('checks');
    c.classList.remove('hidden');
    c.innerHTML = checksHtml(st);
  }
  const recs = (j.result && j.result.records) || [];
  if (recs.length) {
    const box = document.getElementById('dns');
    box.classList.remove('hidden');
    box.innerHTML = dnsTable(recs, verified);
  }
  if (j.status === 'running') {
    document.getElementById('status').textContent = 'Working…';
    setTimeout(tick, 1500);
    return;
  }
  if (verified) {
    document.getElementById('heading').textContent = 'Verified';
    document.getElementById('status').textContent = 'Mailbox is ready. DNS is already done.';
    document.getElementById('again').classList.add('hidden');
    const ok = document.getElementById('success');
    ok.classList.remove('hidden');
    if (j.result && j.result.email) {
      document.getElementById('success-mail').innerHTML =
        `Sign in at webmail as <code>${j.result.email}</code>`;
    }
    return;
  }
  const pending = st ? Object.entries(st).filter(([, v]) => v !== 'Verified').map(([k]) => k) : [];
  document.getElementById('heading').textContent = pending.length ? ('Pending: ' + pending.join(', ')) : 'Check DNS';
  document.getElementById('status').textContent = pending.length
    ? ('Waiting on ' + pending.join(', ') + ' only')
    : 'Not finished';
  if (domain) {
    document.getElementById('again').classList.remove('hidden');
    document.getElementById('again-why').textContent = pending.length
      ? ('Azure is still checking ' + pending.join(', ') + '. Click Verify again after a minute. Do not add the other records again.')
      : 'Not finished yet. After DNS is saved, click Verify again.';
    document.getElementById('again-domain').value = domain;
    document.getElementById('again-link').href = dnsPage + '?domain=' + encodeURIComponent(domain);
  }
}
tick();
</script>
{% endblock %}
