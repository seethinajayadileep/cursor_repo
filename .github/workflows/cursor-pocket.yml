name: cursor-pocket

on:
  push:
    paths:
      - "cursor_pocket/**"
      - "web/**"
      - "tests/test_auth.py"
      - "tests/test_jobs.py"
      - "tests/test_parse.py"
      - "tests/test_api.py"
      - "tests/test_net.py"
      - "tests/test_tunnel.py"
      - "pyproject.toml"
      - ".github/workflows/cursor-pocket.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
