[project]
name = "cursor-pocket"
version = "0.3.4"
description = "Phone remote for Cursor CLI: LAN or internet (--online)."
readme = "CURSOR_POCKET.md"
requires-python = ">=3.10"
license = { file = "cursor_pocket/LICENSE" }

[project.scripts]
cursor-pocket = "cursor_pocket.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cursor_pocket*"]
