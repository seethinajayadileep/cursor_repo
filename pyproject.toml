[project]
name = "openscout"
version = "0.1.0"
description = "Open-source testing agent for web applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.0.0",
]

[project.scripts]
openscout = "openscout.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
